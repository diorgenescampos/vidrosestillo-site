
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orçamento | Vidrosestillo</title>

<meta name="description" content="Solicite orçamento de vidros, box para banheiro, fechamento de sacadas e esquadrias de alumínio com a Vidrosestillo.">

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="orcamento">

<div class="container">


<h2>
Solicite seu orçamento
</h2>


<p>
Preencha os dados abaixo e nossa equipe entrará em contato.
</p>



<form 
action="https://formsubmit.co/SEU_EMAIL"
method="POST"
enctype="multipart/form-data">


<input 
type="text"
name="nome"
placeholder="Seu nome"
required>



<input 
type="tel"
name="telefone"
placeholder="Seu WhatsApp"
required>



<select name="servico" required>


<option value="">
Escolha o serviço
</option>


<option>
Box para banheiro
</option>


<option>
Fechamento de sacada
</option>


<option>
Esquadrias de alumínio
</option>


<option>
Outro projeto
</option>


</select>



<textarea

name="mensagem"

placeholder="Conte um pouco sobre seu projeto, medidas aproximadas ou detalhes">

</textarea>



<label class="upload">

📸 Enviar foto do ambiente

<input

type="file"

name="foto"

accept="image/*">

</label>



<button class="btn" type="submit">

Enviar orçamento

</button>


</form>



<br><br>



<a class="btn"

href="https://wa.me/5551995326229?text=Olá%20Vidrosestillo,%20gostaria%20de%20solicitar%20um%20orçamento."

target="_blank">

Falar pelo WhatsApp

</a>



<br><br>



<a class="btn" href="index.html">

Voltar ao site

</a>



</div>

</section>



</body>

</html>
