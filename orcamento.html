<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orçamento | Vidrosestillo</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<section class="orcamento">

<div class="container">


<h2>
Solicite seu orçamento
</h2>


<p>
Preencha os dados abaixo e nossa equipe entrará em contato.
</p>



<form action="https://formsubmit.co/SEU_EMAIL" method="POST">


<input 
type="text" 
name="nome"
placeholder="Seu nome"
required>


<input 
type="tel"
name="telefone"
placeholder="Seu WhatsApp"
required>



<select name="servico">


<option>
Escolha o serviço
</option>

<option>
Box para banheiro
</option>

<option>
Fechamento de sacada
</option>

<option>
Esquadrias de alumínio
</option>

<option>
Outro projeto
</option>


</select>



<textarea 
name="mensagem"
placeholder="Conte um pouco sobre seu projeto">
</textarea>



<button class="btn" type="submit">

Enviar orçamento

</button>


</form>



<br>


<a class="btn" href="index.html">

Voltar ao site

</a>


</div>

</section>


</body>

</html>
